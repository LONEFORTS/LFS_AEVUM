{% load static %}<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Login · Aevum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="{% static 'css/style.css' %}" rel="stylesheet">
</head><body>
<div class="gate-shell">
  <div class="gate-grid"></div>
  <div class="starfield"></div>

  <div class="gate-card">
    <div class="gate-brand">
      <div class="gate-brand-mark">A</div>
    </div>
    <h1 class="gate-title">Welcome back to <em>Aevum</em></h1>
    <p class="gate-sub">Continue your student operating system.</p>

    <form method="post" autocomplete="on">
      {% csrf_token %}
      <div class="form-group field-float">
        <input type="text" name="username" id="id_username" placeholder=" " value="{{ form.username.value|default:'' }}" required>
        <label for="id_username">Username</label>
      </div>
      <div class="form-group field-float">
        <input type="password" name="password" id="id_password" placeholder=" " required>
        <label for="id_password">Password</label>
      </div>
      {% if form.errors %}<div class="alert-x alert-error"><span data-icon="alert"></span><span>Incorrect username or password. Please try again.</span></div>{% endif %}
      <button class="btn-x btn-primary-x btn-block btn-lg">Login</button>
    </form>

    <hr class="gradient-line">
    <div class="gate-foot">
      <span>No account yet?</span> <a href="{% url 'register' %}">Create one</a>
    </div>
    <div class="gate-foot mt-2"><a href="{% url 'landing' %}" style="border:0">← Back to home</a></div>
  </div>
</div>
<script src="{% static 'js/app.js' %}"></script>
</body></html>
