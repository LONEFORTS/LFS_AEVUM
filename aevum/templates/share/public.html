{% load static %}<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>{{ title }} · Aevum public share</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="{% static 'css/style.css' %}" rel="stylesheet">
</head><body>
<div class="portfolio-shell">
  <div class="portfolio-card" style="max-width:820px">
    <div class="d-flex items-center gap-2 mb-3">
      <div class="brand-mark" style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#1d9bf0,#a78bfa);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;color:#fff">A</div>
      <div class="text-hi" style="font-weight:800;letter-spacing:-.02em">Ae<em style="font-family:'Playfair Display',serif;font-weight:400">vum</em></div>
      <span class="chip accent">{{ kind }}</span>
    </div>
    <h1 class="display-title" style="font-size:clamp(1.8rem,3.4vw,2.6rem)">{{ title }}</h1>
    <div class="markdown-body mt-4">{{ body_html|safe }}</div>
    <hr class="gradient-line">
    <div class="text-mut small text-center">Shared publicly with Aevum · Premium student OS</div>
  </div>
</div>
<script src="{% static 'js/app.js' %}"></script>
</body></html>
